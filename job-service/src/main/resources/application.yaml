spring:
  application:
    name: job-service
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: brijmahulkar
    password: rootroot
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  config:
    import:
      - optional:configserver:http://localhost:8080
  profiles:
    active:
      - dev
server:
  port: 8081
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
# Actuator
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    health:
      show-details: always
    info:
      access: unrestricted
